# Every push and pull request: the database's own checks, the shared library, the
# committed tables and pages against a fresh build, and the built pages in a browser.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:      # rebase-corrections.yml pushes with a token that starts nothing, and dispatches this

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']     # the pinned numpy and scipy need 3.11 or newer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: The two published indexes agree with the database
        run: python tools/check_indexes.py
      - name: The committed tables are what the JSON says
        run: python tools/export_tables.py --check
      - name: The gross divisions are a fresh build of the taxonomy
        run: python tools/build_groups.py --check
      - name: The map coloring is a fresh build of the extents
        run: python tools/build_region_colors.py --check
      - name: The published face maps are a fresh cut of the tracing
        run: python tools/build_facemaps.py --check
      - name: The committed pages are a fresh build
        run: python tools/build_app.py --check
      # Whether a committed artifact is a fresh build is the five --check steps above and not
      # a test: each is the tool's own comparison, names the file that is stale and the tool
      # to re-run it with, and export_tables --check reaches derived fields in the JSON that
      # no test ever read. What pytest carries is what a rebuild cannot tell you -- the
      # database's own invariants, the library, and the fixer's answers against the
      # pipeline's.
      - name: Data invariants and the shared library
        run: python -m pytest tests/python -q

  browser-tests:
    runs-on: ubuntu-latest
    needs: python-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      # the fixer server playwright.config.js starts for tests/js/fixer.spec.js cuts a
      # plate, so it needs the pinned packages; the page build itself does not
      - run: pip install -r tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the pages the tests open
        run: |
          python tools/build_app.py --lean --commit "${GITHUB_SHA::7}"
          python tools/build_app.py --site build/site --commit "${GITHUB_SHA::7}"
      - run: npx playwright test
      # The pages were uploaded here; they are a deterministic build of committed data and
      # can be rebuilt from any checkout. What cannot is what the browser saw when a test
      # failed, which is what playwright.config.js's `screenshot: 'only-on-failure'` leaves
      # in test-results/ -- and half of what these specs assert is layout.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
