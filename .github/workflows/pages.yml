# Deploys the built site to GitHub Pages from a workflow, and attaches the offline
# bundle to a release on a version tag.
#
# The pages committed to the repository keep their build tokens -- a stamp in them was
# three files that conflicted between any two branches, whatever they changed -- so the
# copy a reader opens has to be stamped somewhere, and this is where: every push to main
# builds the site from the commit it deploys and stamps it with that commit.
#
# That only reaches readers once Settings -> Pages -> Source is "GitHub Actions". Until
# it is, Pages serves main's root, which is the committed pages: a reader is told no build
# rather than a token, and the footer dates the data instead of the build (src/app.js drops
# the claim when the stamp is not one and falls back to version.generated, which is a day
# with no hour behind it -- the build's own date and time come back with the stamp). The
# deploy job reads the setting and waits for it rather than failing every push; the build
# job runs either way, so the switch is one setting and no further change here. The URL
# does not change.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site, stamped with this commit
        run: python tools/build_app.py --site build/site --commit "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      # "workflow" once the Pages source is "GitHub Actions", "legacy" while it is a
      # branch, "none" if Pages is off. Deploying under the other two fails, and a red
      # main on every push is a worse signal than a skipped job.
      - name: Which source is Pages serving?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo none)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Pages source: $kind"
          [ "$kind" = workflow ] || echo "::notice::Pages is serving $kind, so this build was not deployed. Settings -> Pages -> Source: \"GitHub Actions\" hands it to this workflow."
      - name: Attach the offline bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md" || true
          gh release upload "${GITHUB_REF_NAME}" build/site/gerbil_atlas_explorer.html --clobber

  deploy:
    needs: build
    if: needs.build.outputs.source == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
