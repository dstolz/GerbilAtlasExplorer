# A correction to how a region is drawn, pushed as corrections/<id>.json on a branch
# correction/<id> -- from the browser (tools/atlasfix.py) or from MATLAB
# (matlab/AtlasRegionFix.m) -- is applied here: a Claude Code session
# follows .claude/skills/atlas-region-fix/SKILL.md -- diagnoses the input at fault, fixes
# it, rebuilds the extents and everything cut from them, runs every check, writes the
# CHANGELOG and METHODS entries, pushes to the same branch and opens a pull request -- and
# the last step merges the pull request once CI is green. GitHub Pages serves main, so the
# site updates on the merge.
#
# The push does not run the session. The action reads the event that started it, and `push`
# is not one it knows: it parses issues, pull requests and their comments and reviews,
# workflow_dispatch, repository_dispatch, schedule and workflow_run, and throws
# `Unsupported event type: push` before it looks at the prompt at all. So the push does the
# one thing it can -- it dispatches this same workflow on the same branch -- and the run
# that comes back does the work. workflow_dispatch is one of the two events GITHUB_TOKEN is
# allowed to raise, which is what lets the hop be made with no secret of its own, and a
# dispatch runs the workflow file on the ref it names, so a correction is still applied by
# its own checkout of the pipeline.
#
# Setup, once: `claude /install-github-app` from a local terminal, taking the subscription
# option. That installs the Claude GitHub App on the repository and writes the one secret
# this reads, CLAUDE_CODE_OAUTH_TOKEN; by hand it is `claude setup-token` and `gh secret
# set`. The token lasts a year, and a lapsed one shows up as the `Apply them` step failing
# to authenticate with the branch and its correction untouched.
#
# The action is deliberately handed no `github_token`: without one it exchanges this
# workflow's OIDC token (hence `id-token: write`) for a short-lived App installation token,
# and pushes made with that token start ci.yml, where pushes made with the default
# GITHUB_TOKEN would not -- so the correction's own pull request would never get a check to
# wait for.
#
# The session's own commits touch data/, svg/, tools/ and the docs, never corrections/, so
# the paths filter is what keeps them from starting this again. The actor guard is the belt
# to that brace and not the thing relied on: the actor string on an App-token push is read
# off the App's slug rather than documented anywhere.
name: Apply correction

on:
  push:
    branches: ['correction/**']
    paths: ['corrections/**']
  workflow_dispatch:
    inputs:
      correction:
        description: 'corrections/<id>.json to apply, on the branch this is run from; blank takes every correction the branch adds to main'
        required: false
        type: string

jobs:
  # The hop. Nothing is checked out here: which corrections the branch carries is read on
  # the other side, where a checkout is being made anyway, so this is a token and one API
  # call.
  dispatch:
    if: github.event_name == 'push' && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read                    # to resolve the ref the dispatch names
      actions: write
    steps:
      - name: Hand the branch to a run the action can read
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-correction.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:                        # on the job, so the dispatch above is never queued behind an apply
      group: correction-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0                # build_app.py stamps the page from git, and the diff below needs main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Which corrections this branch carries
        id: files
        env:
          CORRECTION: ${{ inputs.correction }}
        run: |
          list="$CORRECTION"
          if [ -z "$list" ]; then
            git fetch origin main
            list=$(git diff --name-only origin/main...HEAD -- 'corrections/*.json' | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "corrections: $list"
          [ -n "$list" ] || { echo "no correction file on this branch"; exit 1; }
      - name: Read them
        run: python3 tools/corrections.py validate ${{ steps.files.outputs.list }}

      - name: Apply them
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The run was raised by the dispatch above, so the actor on it is
          # github-actions[bot] and not whoever pushed; the action refuses a non-human
          # actor unless the bot is named here. Only a workflow of this repository is
          # handed a GITHUB_TOKEN, so naming it opens nothing to an account outside it.
          allowed_bots: github-actions
          # `actions: read` above is the workflow's own grant; the token the action mints
          # for itself is scoped by this, and without it the session cannot read the CI it
          # is trying to get green.
          additional_permissions: |
            actions: read
          prompt: |
            Branch ${{ github.ref_name }} of ${{ github.repository }} carries a correction to
            how a region of the atlas is drawn: ${{ steps.files.outputs.list }}

            Read .claude/skills/atlas-region-fix/SKILL.md and follow it end to end for each
            file: diagnose the cause, fix the pipeline input at fault, rebuild, run every
            check, write the CHANGELOG and METHODS entries, commit, push to this same branch,
            and open a pull request against main with `gh pr create`. Do not merge it, and do
            not edit the correction file. Python dependencies and Playwright are installed.
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --max-turns 300

      - name: Merge when CI is green
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token || github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" --fill-first
            pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "pull request #$pr"
          # With a branch-protection rule, auto-merge waits for the checks it requires.
          # Without one GitHub refuses to arm it, so wait on the checks here and merge.
          if gh pr merge "$pr" --auto --squash --delete-branch; then
            exit 0
          fi
          sleep 90                                     # let ci.yml register on the head
          gh pr checks "$pr" --watch --fail-level error
          gh pr merge "$pr" --squash --delete-branch
