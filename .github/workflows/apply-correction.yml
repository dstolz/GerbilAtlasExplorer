# A correction to how a region is drawn, pushed as corrections/<id>.json on a branch
# correction/<id> -- from the browser (fixer.html, tools/atlasfix.py) or from MATLAB
# (matlab/AtlasRegionFix.m) -- is applied here: a Claude Code session follows
# .claude/skills/atlas-region-fix/SKILL.md -- diagnoses the input at fault, fixes it,
# rebuilds the extents and everything cut from them, runs every check, writes it up and
# pushes to the same branch -- and the workflow opens the pull request from the write-up
# the session left and waits on CI. The run stops at the pull request: a correction is a
# change to what the atlas says a structure is, and it is read by a person before it
# lands. GitHub Pages is deployed from main by hand, so the site updates when that is done.
#
# The push does not run the session. The action reads the event that started it, and
# `push` is not one it knows, so the push dispatches this same workflow on the same branch
# and the run that comes back does the work. workflow_dispatch is one of the two events
# GITHUB_TOKEN may raise, which is what lets the hop be made with no secret of its own.
#
# The shell of this file is tools/ci/correction.sh, which tests/python/test_ci_scripts.py
# runs against a repository it makes; what is left inline is the wiring. `dry_run` runs
# every step but the session, so the wiring can be checked in two minutes rather than
# after forty.
#
# Setup, once: `claude /install-github-app` from a local terminal, taking the subscription
# option. That installs the Claude GitHub App on the repository and writes the one secret
# this reads, CLAUDE_CODE_OAUTH_TOKEN; by hand it is `claude setup-token` and `gh secret
# set`. The token lasts a year, and a lapsed one shows up as the `Apply them` step failing
# to authenticate with the branch and its correction untouched.
#
# The action is deliberately handed no `github_token`: without one it exchanges this
# workflow's OIDC token (hence `id-token: write`) for a short-lived App installation token,
# and pushes made with that token start ci.yml, where pushes made with the default
# GITHUB_TOKEN would not -- so the correction's own pull request would never get a check to
# wait for.
#
# Claude Code is installed by a step of this workflow rather than by the action, at a
# version that has carried a run, and checked for the binary it was meant to leave; the
# action's own installer once exited 0 having placed nothing (#107).
#
# What keeps a run from starting itself again: the session's commits touch data/, svg/,
# tools/ and the docs, never corrections/, so the paths filter does not see them; a merge
# commit is refused by `correction.sh pushed`, which wants one parent and a correction
# file added on it; and a dispatched run that finds the branch already carrying a fix
# stops before it installs anything, unless `force` says otherwise.
name: Apply correction

on:
  push:
    branches: ['correction/**']
    paths: ['corrections/**']
  workflow_dispatch:
    inputs:
      correction:
        description: 'corrections/<id>.json to apply, on the branch this is run from; blank takes every correction the branch adds to main'
        required: false
        type: string
      force:
        description: 'run the session even if the branch already carries a fix'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'every step but the session: check the wiring'
        required: false
        type: boolean
        default: false

jobs:
  # The hop. The checkout is two commits deep, which is what `pushed` needs to tell a
  # correction from a merge.
  dispatch:
    if: github.event_name == 'push' && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Was a correction pushed, and not a merge
        id: pushed
        run: bash tools/ci/correction.sh pushed
      - name: Hand the branch to a run the action can read
        if: steps.pushed.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-correction.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:                        # on the job, so the dispatch above is never queued behind an apply
      group: correction-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0                # the rebase and the diffs below need main

      - name: Which corrections this branch carries
        id: files
        env:
          CORRECTION: ${{ inputs.correction }}
        run: |
          git fetch origin main
          if [ -n "$CORRECTION" ]; then
            echo "list=$CORRECTION" >> "$GITHUB_OUTPUT"
            echo "corrections: $CORRECTION"
          else
            bash tools/ci/correction.sh list
          fi

      # A dispatch raised by a merge that slipped past `pushed`, or by hand on a branch
      # whose session already ran, stops here: the fix is on the branch, and the pull
      # request is where it is read.
      - name: Is the fix already on the branch
        id: state
        run: bash tools/ci/correction.sh fix
      - name: Already applied
        if: steps.state.outputs.fixed == 'true' && !inputs.force
        run: |
          {
            echo "### Already applied"
            echo
            echo "\`$GITHUB_REF_NAME\` already carries a fix beside ${{ steps.files.outputs.list }}; the session is not run again."
            echo "Dispatch with \`force\` to run it anyway."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.state.outputs.fixed != 'true' || inputs.force
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - if: steps.state.outputs.fixed != 'true' || inputs.force
        run: pip install -r tools/requirements.txt

      - name: Read them
        if: steps.state.outputs.fixed != 'true' || inputs.force
        run: python3 tools/corrections.py validate ${{ steps.files.outputs.list }}

      # The branch is brought up to main before anything is cut, so the derived files are
      # rebuilt on the inputs they will be committed with. Before a fix exists the branch
      # carries nothing but the correction, and the merge is trivial.
      - name: Bring the branch up to main
        if: steps.state.outputs.fixed != 'true' || inputs.force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/corrections.py rebase --onto origin/main

      # The reading the session would otherwise spend its first turns making: each
      # correction against the extraction, and the two pictures.
      - name: Inspect them
        id: inspect
        if: steps.state.outputs.fixed != 'true' || inputs.force
        run: |
          mkdir -p build
          for f in ${{ steps.files.outputs.list }}; do
            echo "### $f"
            echo '```'
            python3 tools/corrections.py inspect "$f" --qc
            echo '```'
          done > build/inspect.md
          cat build/inspect.md
          {
            echo 'text<<INSPECT_EOF'
            cat build/inspect.md
            echo 'INSPECT_EOF'
          } >> "$GITHUB_OUTPUT"

      # The version is one that has carried a run and is moved by hand. The directory is
      # made first because one installer no longer makes it; the fallback is for an
      # installer that downloaded the binary to its versioned path and failed only to
      # place the launcher; and a step that finds neither fails here, naming what it
      # looked for, rather than at the SDK with a stack trace.
      - name: Install Claude Code
        id: cli
        if: (steps.state.outputs.fixed != 'true' || inputs.force) && !inputs.dry_run
        env:
          VERSION: '2.1.263'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSION"
          bin="$HOME/.local/bin/claude"
          if [ ! -x "$bin" ]; then
            bin=$(find "$HOME/.local/share/claude/versions" -maxdepth 1 -type f -name "$VERSION*" -perm -u+x 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$bin" ] || [ ! -x "$bin" ]; then
            echo "::error::the installer exited 0 and left no claude binary at ~/.local/bin/claude or under ~/.local/share/claude/versions/$VERSION"
            exit 1
          fi
          "$bin" --version
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Apply them
        id: claude
        if: (steps.state.outputs.fixed != 'true' || inputs.force) && !inputs.dry_run
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.cli.outputs.path }}
          # The run was raised by the dispatch above, so the actor on it is
          # github-actions[bot] and not whoever pushed; the action refuses a non-human
          # actor unless the bot is named here. Only a workflow of this repository is
          # handed a GITHUB_TOKEN, so naming it opens nothing to an account outside it.
          allowed_bots: github-actions
          additional_permissions: |
            actions: read
          prompt: |
            Branch ${{ github.ref_name }} of ${{ github.repository }} carries a correction to
            how a region of the atlas is drawn: ${{ steps.files.outputs.list }}

            Read .claude/skills/atlas-region-fix/SKILL.md and follow it end to end for each
            file: diagnose the cause, fix the pipeline input at fault, rebuild and check with
            `tools/pipeline.py`, write the CHANGELOG entry and the write-up, commit, and push
            to this same branch. Do not open the pull request: write `build/pr.md` as the
            skill says and this workflow opens it from that file. Do not merge, and do not
            edit the correction file. Python dependencies are installed, the branch is
            already current with main, and `inspect --qc` has been run for you -- its
            output is below and its pictures are under qc/.

            Nobody is at the other end of this run. Where the evidence allows more than one
            reading -- which of the four causes it is, or which of two fixes for the one it
            is -- take the reading the drawing supports, apply it, and say in the write-up
            which you took, what the alternative was, and what would tell them apart. Do not
            end the run to ask: the correction is read by a person before it is merged, and
            that is where a question belongs, whereas a session that stops without a commit
            leaves the plate exactly as it was. The one case for stopping is a plate that
            supports none of the four causes: say that in your last message, which is what
            the job summary shows.

            A correction run changes pipeline inputs, the docs and qc/; it never edits
            tools/, src/, tests/ or the workflows. If a tool is wrong, say so in the write-up.

            ${{ steps.inspect.outputs.text }}
          # The model is named rather than left to the action's default: this is a long
          # job that turns on a judgment the correction file does not make for it. The
          # one correction carried the whole way before the model was named was done on
          # Opus; the two runs that stopped five minutes in took the default.
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --model claude-opus-5
            --max-turns 300

      # The action revokes the token it mints in its last step, so everything below is the
      # workflow's own GITHUB_TOKEN. What that token cannot do is start a workflow, and
      # nothing here needs it to: the session's push, made with the app token, has already
      # put ci.yml onto the head commit.
      - name: The session left a fix on the branch
        if: (steps.state.outputs.fixed != 'true' || inputs.force) && !inputs.dry_run
        env:
          LIST: ${{ steps.files.outputs.list }}
          EXECUTION: ${{ steps.claude.outputs.execution_file }}
        run: |
          git fetch origin main "$GITHUB_REF_NAME"
          git checkout -q "origin/$GITHUB_REF_NAME"
          if ! bash tools/ci/correction.sh fix | grep -q '^fixed=true'; then
            said=$(jq -r '[.[]? | select(.type == "result")] | last | .result // empty' "$EXECUTION" 2>/dev/null || true)
            {
              echo "### The correction was not applied"
              echo
              echo "\`$GITHUB_REF_NAME\` carries nothing but $LIST, so there is nothing to read."
              echo
              echo "What the session said before it stopped:"
              echo
              echo '```'
              echo "${said:-(the run left no final message)}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the session ended without a fix on $GITHUB_REF_NAME; the correction is unapplied"
            exit 1
          fi
          # A fix that edits the file it is applying breaks the loop guard and the record
          # of what the reader drew.
          bash tools/ci/correction.sh untouched "$GITHUB_SHA" $LIST

      # The run ends at a green pull request rather than on main. The pull request is
      # opened from build/pr.md, which the session wrote beside its push: the first line
      # is the title, the rest the body, and {{SHA}} in it is the head the picture is
      # pinned to. Merging is the reader's.
      - name: Open the pull request, wait on CI, and leave it to be read
        if: (steps.state.outputs.fixed != 'true' || inputs.force) && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$(bash tools/ci/correction.sh open-pr "$GITHUB_REF_NAME" | grep -E '^(pr|url)=')"
          echo "pull request #$pr -- $url"
          if bash tools/ci/correction.sh wait-ci "$pr"; then
            state='CI is green. Read it and merge it -- the run stops here.'
            failed=0
          else
            state='CI is red on the fix. It wants another pass before it is worth reading.'
            failed=1
          fi
          {
            echo "### The correction is applied, and waiting to be read"
            echo
            echo "[Pull request #$pr]($url) -- $state"
            echo
            echo 'The picture of what the correction did opens the pull request; `qc/chk_corr_<id>.png` is the whole plate, in the diff.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Dry run
        if: inputs.dry_run
        run: |
          {
            echo "### Dry run"
            echo
            echo "Every step but the session ran on \`$GITHUB_REF_NAME\` for ${{ steps.files.outputs.list }}."
            echo "The branch already carried a fix: ${{ steps.state.outputs.fixed }}."
          } >> "$GITHUB_STEP_SUMMARY"
