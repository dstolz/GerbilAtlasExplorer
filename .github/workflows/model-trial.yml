# A trial, not part of the pipeline: correction 20260924T134430Z (GrO and aci on plate 4,
# pull request #167) applied again from the state its session started from, once per model
# and effort in the matrix, so the fixes can be read side by side against the one merged.
#
# The start is b609852 (the correction alone) merged with c989d63 (main just before #167
# landed), which is what apply-correction.yml's rebase step would have made: today's
# tools, skill and prompt, and no fix. origin/main is pinned to c989d63 in the checkout and
# the remote is cut, so `inspect`, `report` and the diffs read against the base the
# original did and not against a main that already carries the fix.
#
# Nothing leaves the runner: no credential to push with, no pull request. The session is
# run with the CLI directly (2.1.281: the pinned 2.1.263 rejects claude-opus-5-5) rather than through claude-code-action, since this is started
# by a push and the action reads only the events it knows. What each run leaves -- the
# commits as a bundle, the write-up, the QC pictures, the transcript, the checks -- is
# uploaded as an artifact.
name: Model trial (correction 20260924T134430Z)

on:
  push:
    branches: ['claude/upbeat-euler-k7e6y9']
    paths: ['.github/workflows/model-trial.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CORRECTION_TIP: b6098528294b5d4ce4e1d86627e8f13d160f3614
  BASE_SHA: c989d63c2e4ffbc7bc17045fe8544086ea61e8db
  LIST: corrections/20260924T134430Z-p04-GrO.json corrections/20260924T134430Z-p04-aci.json

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fable-5.1-medium
            model: claude-fable-5-1
            effort: medium
          - name: opus-5.5-xhigh
            model: claude-opus-5-5
            effort: xhigh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CORRECTION_TIP }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the base, cut the remote
        run: |
          git update-ref refs/remotes/origin/main "$BASE_SHA"
          git for-each-ref --format='%(refname)' refs/remotes refs/tags \
            | { grep -vx 'refs/remotes/origin/main' || true; } | xargs -r -n1 git update-ref --no-deref -d
          git remote set-url origin /nonexistent
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B correction/20260924T134430Z
          git log --oneline -1 origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt

      - name: Bring the branch up to the base
        run: |
          python3 tools/corrections.py validate $LIST
          python3 tools/corrections.py rebase --onto origin/main
          echo "START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log --oneline -3

      - name: Inspect them
        run: |
          mkdir -p build/trial
          for f in $LIST; do
            echo "### $f"
            echo '```'
            python3 tools/corrections.py inspect "$f" --qc
            echo '```'
          done > build/inspect.md
          cat build/inspect.md

      - name: Install Claude Code
        id: cli
        env:
          VERSION: '2.1.281'      # 2.1.263 rejects claude-opus-5-5 (needs 2.1.280+); both jobs on one CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSION"
          bin="$HOME/.local/bin/claude"
          if [ ! -x "$bin" ]; then
            bin=$(find "$HOME/.local/share/claude/versions" -maxdepth 1 -type f -name "$VERSION*" -perm -u+x 2>/dev/null | head -n 1 || true)
          fi
          [ -n "$bin" ] && [ -x "$bin" ] || { echo "::error::no claude binary"; exit 1; }
          "$bin" --version
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Is the credential good, for this model and effort
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BIN: ${{ steps.cli.outputs.path }}
        run: |
          "$BIN" -p 'Reply with one word: ready' --model '${{ matrix.model }}' --effort '${{ matrix.effort }}' \
            --max-turns 1 --output-format json | tee build/trial/credential.json
          jq -e '.is_error == false' build/trial/credential.json

      # The production prompt, with two changes: commit and do not push, and open no pull
      # request. Everything else is apply-correction.yml's as of c989d63.
      - name: Apply them
        id: session
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BIN: ${{ steps.cli.outputs.path }}
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          BASH_DEFAULT_TIMEOUT_MS: '2700000'
          BASH_MAX_TIMEOUT_MS: '2700000'
        run: |
          {
            cat <<EOF
          Branch correction/20260924T134430Z of dstolz/GerbilAtlasExplorer carries a correction to
          how a region of the atlas is drawn: $LIST

          Read .claude/skills/atlas-region-fix/SKILL.md and follow it end to end for each
          file: diagnose the cause, fix the pipeline input at fault, rebuild and check with
          \`tools/pipeline.py\`, write the CHANGELOG entry and the write-up, and commit on this
          branch. This run is a trial: do not push and do not open a pull request -- there is
          no remote to push to, and origin/main in this checkout is the base to compare
          against; do not fetch. Leave \`build/pr.md\` where it is: it is read from the runner.
          Do not merge, and do not edit the correction file. Python dependencies are
          installed, the branch is already current with main, and \`inspect --qc\` has been
          run for you -- its output is below and its pictures are under qc/.

          Nobody is at the other end of this run. Where the evidence allows more than one
          reading -- which of the four causes it is, or which of two fixes for the one it
          is -- take the reading the drawing supports, apply it, and say in the write-up
          which you took, what the alternative was, and what would tell them apart. Do not
          end the run to ask: the correction is read by a person before it is merged, and
          that is where a question belongs, whereas a session that stops without a commit
          leaves the plate exactly as it was. The one case for stopping is a plate that
          supports none of the four causes. Write what you read to \`build/no-fix.md\` --
          first line the title, the rest your reading, in the voice \`build/pr.md\` would
          have had -- and stop there, with the inputs as you found them. Say it in your last
          message too.

          Run every command in the foreground and wait for it, the rebuild included. This
          session ends at its first final message, and anything still running then is
          killed with it: never end a turn to wait on a command.

          A correction run changes pipeline inputs, the docs and qc/; it never edits
          tools/, src/ or the workflows. If a tool is wrong, say so in the write-up. In
          tests/ it changes one thing: a literal the rebuild moved, with the note that says
          what moved it, in a commit of its own after the fix -- never a test's logic, never
          a test or an assertion taken out, never a skip. CI runs the tests on the pull
          request, and a literal left stale leaves it red.

          EOF
            cat build/inspect.md
          } > build/trial/prompt.md
          start=$(date +%s)
          set +e
          "$BIN" -p "$(cat build/trial/prompt.md)" \
            --model '${{ matrix.model }}' --effort '${{ matrix.effort }}' \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" --max-turns 300 \
            --output-format stream-json --verbose > build/trial/transcript.jsonl 2> build/trial/stderr.txt
          code=$?
          echo "wall_seconds=$(( $(date +%s) - start ))" > build/trial/wall.txt
          exit $code

      - name: What the session left
        if: always()
        run: |
          mkdir -p build/trial/out
          t=build/trial
          jq -c 'select(.type == "result")' $t/transcript.jsonl 2>/dev/null | tail -n 1 > $t/result.json || true
          git log --format='%h %s' "$START..HEAD" > $t/out/commits.txt || true
          git diff --stat "$START" HEAD > $t/out/diffstat.txt || true
          git diff "$START" HEAD -- . ':!data/gerbil_atlas_volumes.json' ':!data/gerbil_atlas_labels.nii.gz' ':!*.png' \
            > $t/out/text.patch || true
          git bundle create $t/out/trial.bundle "$BASE_SHA..HEAD" || true
          git status --porcelain > $t/out/uncommitted.txt || true
          BASE=origin/main bash tools/ci/correction.sh verdict | tee $t/out/verdict.txt || true
          for f in build/pr.md build/no-fix.md; do [ -f "$f" ] && cp "$f" $t/out/ || true; done
          mkdir -p $t/out/qc
          git diff --name-only "$START" HEAD -- 'qc/*.png' | xargs -r -I{} cp {} $t/out/qc/ || true
          ls qc/chk_corr_20260924T134430Z* 2>/dev/null | xargs -r -I{} cp {} $t/out/qc/ || true

      - name: Every check, on what it left
        if: always()
        run: |
          set +e
          python3 tools/pipeline.py check > build/trial/out/check.txt 2>&1
          echo "pipeline_check_exit=$?" >> build/trial/out/check.txt
          tail -n 40 build/trial/out/check.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-${{ matrix.name }}
          path: build/trial/
          retention-days: 14
